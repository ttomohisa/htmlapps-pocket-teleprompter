name: Release versioned HTML
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-versioned-html
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build and verify the exact main revision
        shell: powershell
        run: ./scripts/check-repository.ps1
      - name: Read configured release version
        id: version
        shell: pwsh
        run: |
          $config = Get-Content -Raw -Encoding UTF8 app.config.json | ConvertFrom-Json
          "tag=v$($config.version)" >> $env:GITHUB_OUTPUT
      - name: Publish tag and HTML assets if version is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $tagExists = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Could not check existing tags" }
          if ($tagExists) {
            Write-Host "Tag $env:RELEASE_TAG already exists; leaving this published version unchanged."
            exit 0
          }
          gh release create $env:RELEASE_TAG `
            "dist/index.html#pocket-teleprompter-$env:RELEASE_TAG.html" `
            "dist/index.self-extract.html#pocket-teleprompter-$env:RELEASE_TAG-self-extract.html" `
            --target $env:GITHUB_SHA `
            --title "Pocket Teleprompter $env:RELEASE_TAG" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed" }
